# ============================================================
# Основные настройки Spring Boot приложения
# ============================================================

spring:
  application:
    name: smart-authentication-module
  # Активируем Vault как источник конфигурации
  config:
    import: optional:vault://secret/smart-authentication-module

  # ---------- База данных PostgreSQL ----------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USER:postgres}
    password: ${db.password}                     # из Vault
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------- JPA / Hibernate ----------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        temp:
          use_jdbc_metadata_defaults: false
    open-in-view: false

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ---------- Thymeleaf ----------
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # ---------- Vault ----------
  cloud:
    vault:
      host: vault
      port: 8200
      scheme: http
      authentication: TOKEN
      token: dev-only-token
      kv:
        enabled: true
        backend: secret
        default-context: smart-authentication-module

# ---------- Сервер ----------
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# ---------- Логирование ----------
logging:
  level:
    com.vkr.auth: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    com.yubico: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/auth-module.log
    max-size: 10MB
    max-history: 30

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: env,health,info,metrics   # пока оставим env для проверки
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true

# ============================================================
# Пользовательские настройки модуля аутентификации
# ============================================================
auth:
  webauthn:
    rp-id: ${RP_ID:localhost}
    rp-name: "Smart Authentication Module"
    origin: ${RP_ORIGIN:http://localhost:8080}
  geoip:
    database: classpath:GeoLite2-City.mmdb
  jwt:
    access-secret: ${jwt.access-secret}          # из Vault
    refresh-secret: ${jwt.refresh-secret}        # из Vault
    access-expiration-ms: 900000                 # 15 минут
    refresh-expiration-ms: 604800000             # 7 дней

# Настройка CompreFace
compreface:
  base-url: ${COMPREFACE_BASE_URL:http://localhost:8001}
  api-key: ${compreface.api-key}                 # из Vault
  recognition-url: ${compreface.base-url}/api/v1/recognition/${compreface.api-key}